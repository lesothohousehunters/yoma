<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOMA Lesotho Analytics</title>
<style>
:root{--dark:#1E4D2B;--mid:#3E7D23;--soft:#A9D18E;--pale:#E4F0D8;--bg:#F2F6EC;--line:#D5E2CC;--gold:#F2C14E;--ink:#1B2B1F;--muted:#4B6B52}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.35}
header{background:var(--dark);color:#fff;padding:18px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header img{width:64px;height:64px;border-radius:14px;background:#fff}
header .t{flex:1;min-width:240px}
header .eyebrow{font-size:12px;letter-spacing:2px;color:var(--soft);font-weight:700}
header h1{margin:2px 0 0;font-size:26px}
header .sub{color:var(--gold);font-size:14px}
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:#fff;background:rgba(255,255,255,.12);padding:8px 14px;border-radius:20px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite}
.dot.off{background:#c0c0c0;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,193,78,.7)}70%{box-shadow:0 0 0 10px rgba(242,193,78,0)}100%{box-shadow:0 0 0 0 rgba(242,193,78,0)}}
main{max-width:1240px;margin:0 auto;padding:20px 16px 40px}
.banner{background:#FFF6DA;border:1px solid var(--gold);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px;display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.kpi .v{font-size:34px;font-weight:800;color:var(--dark);line-height:1.1;margin-top:4px}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.dark{background:var(--dark);border-color:var(--dark)}
.kpi.dark .l,.kpi.dark .s{color:var(--soft)}
.kpi.dark .v{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}
.panel.wide{grid-column:1/-1}
.panel h2{margin:0 0 2px;font-size:18px;color:var(--dark)}
.panel .hint{font-size:13px;color:var(--muted);margin-bottom:12px}
.row{display:grid;grid-template-columns:150px 1fr 76px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.row .n{font-weight:600;display:flex;align-items:center;gap:6px}
.row .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:16px;background:var(--pale);border-radius:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--mid);border-radius:8px;transition:width .6s}
.bar i.over{background:var(--gold)}
.bar i.north{background:var(--dark)}.bar i.central{background:var(--mid)}.bar i.south{background:#7FB35C}
.chip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;background:var(--pale);color:var(--dark)}
.split{display:flex;height:34px;border-radius:10px;overflow:hidden;margin:8px 0 6px}
.split div{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.months{display:flex;gap:18px;align-items:flex-end;height:230px;padding:10px 0 0}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.mpair{display:flex;gap:6px;align-items:flex-end;width:100%;justify-content:center;flex:1}
.mb{width:46%;min-width:58px;max-width:78px;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:12px;font-weight:800;padding-top:4px;min-height:2px;transition:height .6s}
.mb.plan{background:transparent;border:2px dashed var(--mid);color:var(--mid)}
.mb.act{background:var(--dark);color:var(--gold)}
.mlab{font-size:13px;font-weight:700;margin-top:6px}
.list{max-height:360px;overflow:auto;padding-right:4px}
.latest{list-style:none;margin:0;padding:0;font-size:14px}
.latest li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--pale)}
.latest li:first-child{background:var(--pale);padding-left:8px;padding-right:8px;border-radius:8px}
.idea{padding:8px 0;border-bottom:1px solid var(--pale);font-size:14px}
.idea span{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}

.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.rc{border:2px solid var(--line);border-radius:16px;padding:16px;position:relative}
.rc.lead{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.25)}
.rc .who{font-size:12px;letter-spacing:1.5px;font-weight:800;color:var(--muted)}
.rc .nm{font-size:22px;font-weight:800;color:var(--dark)}
.rc .big{font-size:40px;font-weight:800;line-height:1.05;color:var(--dark);margin-top:6px}
.rc .big small{font-size:16px;font-weight:600;color:var(--muted)}
.rc .tag{position:absolute;top:14px;right:14px;background:var(--gold);color:#1B2B1F;font-size:12px;font-weight:800;border-radius:10px;padding:3px 10px}
.rc dl{margin:12px 0 0;display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}
.rc dt{color:var(--muted)}.rc dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.mini{display:flex;gap:8px;margin-top:12px}
.mini div{flex:1;text-align:center;background:var(--pale);border-radius:10px;padding:6px 2px;font-size:12px;color:var(--muted)}
.mini b{display:block;font-size:16px;color:var(--ink)}
.mini .ahead b{color:var(--mid)}.mini .behind b{color:#B3261E}
.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
.cmp th,.cmp td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--pale)}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.cmp .best{background:var(--pale);font-weight:800;border-radius:6px}

/* login */
body.locked>header,body.locked>main,body.locked>footer{display:none}
#login{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(rgba(8,28,14,.30),rgba(8,28,14,.55)),var(--bgimg,none) center/cover no-repeat,linear-gradient(135deg,#1E4D2B,#3E7D23 60%,#A9D18E)}
body.locked #login{display:flex}
.glass{width:100%;max-width:400px;padding:34px 28px 28px;border-radius:24px;text-align:center;color:#fff;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);box-shadow:0 20px 50px rgba(0,0,0,.28);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.glass img{height:96px;max-width:220px;object-fit:contain;background:#fff;border-radius:18px;padding:8px}
.glass h1{margin:18px 0 22px;font-size:24px;font-weight:800;letter-spacing:2.5px;line-height:1.2}
.glass label{display:block;text-align:left;font-size:13px;font-weight:700;letter-spacing:.5px;margin:0 0 6px}
.glass input{width:100%;font:inherit;font-size:16px;padding:12px 14px;margin-bottom:14px;border-radius:12px;color:#fff;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);outline:none}
.glass input::placeholder{color:rgba(255,255,255,.75)}
.glass input:focus{border-color:var(--gold);background:rgba(255,255,255,.22)}
.pw{position:relative}.pw input{padding-right:64px}
.pw button{position:absolute;right:8px;top:8px;background:none;border:0;color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:6px}
.glass .go{width:100%;margin-top:6px;padding:13px;border:0;border-radius:12px;background:var(--gold);color:#1B2B1F;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.glass .go:disabled{opacity:.7;cursor:wait}
.glass .err{min-height:20px;margin-top:12px;font-size:14px;font-weight:700;color:#FFE1A6}
.out{margin-left:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
@media(max-width:560px){.row{grid-template-columns:110px 1fr 60px}header h1{font-size:21px}}
/* toolbar: search, filters, download */
body.locked>.tools{display:none}
.tools{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1.5px solid var(--line);box-shadow:0 2px 10px rgba(30,77,43,.06)}
.tin{max-width:1240px;margin:0 auto;padding:10px 16px 6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:240px;display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.search:focus-within{border-color:var(--mid)}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;padding:10px 12px;background:transparent}
.search button{border:0;background:var(--dark);color:#fff;font:inherit;font-weight:700;padding:0 18px;cursor:pointer}
.tb{border:1.5px solid var(--line);background:#fff;color:var(--dark);font:inherit;font-weight:700;border-radius:12px;padding:10px 14px;cursor:pointer}
.tb.gold{background:var(--gold);border-color:var(--gold);color:#1B2B1F}
.tb:disabled{opacity:.7;cursor:wait}
.dl{position:relative}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1.5px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.14);min-width:270px;padding:6px;z-index:30}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--pale)}
.menu b{display:block;color:var(--dark)}.menu span{font-size:12px;color:var(--muted)}
.fpanel{display:none;max-width:1240px;margin:0 auto;padding:4px 16px 6px;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fpanel.open{display:flex}
.fpanel label{display:flex;flex-direction:column;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;gap:3px}
.fpanel select,.fpanel input{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);padding:7px 8px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-width:140px}
.dates{display:none;gap:10px}
.active{max-width:1240px;margin:0 auto;padding:2px 16px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.active .muted{color:var(--muted)}
.fchip{border:0;background:var(--pale);color:var(--dark);font:inherit;font-size:13px;font-weight:700;border-radius:14px;padding:4px 10px;cursor:pointer}
.fchip b{margin-left:4px}
.fclear{border:0;background:none;color:#B3261E;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px 6px}
.sres{border-color:var(--gold)}
.fbp{border-color:#1877F2}
.fbk{border-color:#1877F2}
.fbg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:14px}
.sres .cmp td:nth-child(2){text-align:left}
/* report (PDF) layout */
.rhead{display:none}
body.report .rhead{display:block;background:var(--dark);color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:16px;font-size:14px}
.rhead .eb{font-size:12px;letter-spacing:2px;color:var(--soft);font-weight:700}
.rhead h1{margin:4px 0;font-size:24px;color:#fff}
body.report main{width:1100px;max-width:none}
body.report .list{max-height:none;overflow:visible}
body.report #chkp,body.report .tools{display:none}
@media(max-width:560px){.tools{position:static}.search{flex:1 1 100%}.fpanel{display:none}.fpanel label{flex:1 1 45%}.fpanel select{min-width:0;width:100%}.tin .tb,.dl{flex:1}.dl .tb{width:100%}.menu{left:0;right:auto;min-width:0;width:100%}}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(n){return Number(n||0).toLocaleString('en-US');}
function sum(o){var t=0;for(var k in o){t+=o[k];}return t;}
function barRow(label,value,max,cls,right){
  var pct=max>0?Math.min(100,value/max*100):0;
  return '<div class="row"><div class="n">'+label+'</div><div class="bar"><i class="'+(cls||'')+'" style="width:'+pct+'%"></i></div><div class="v">'+(right==null?num(value):right)+'</div></div>';
}
function listBars(obj,order,cls){
  var keys=order&&order.length?order.slice():Object.keys(obj);
  Object.keys(obj).forEach(function(k){if(keys.indexOf(k)<0)keys.push(k);});
  keys=keys.filter(function(k){return obj[k]>0;}).sort(function(a,b){return obj[b]-obj[a];});
  if(!keys.length)return '<div class="empty">No answers yet.</div>';
  var max=obj[keys[0]],t=sum(obj);
  return keys.map(function(k){return barRow(esc(k),obj[k],max,cls,num(obj[k])+' · '+Math.round(obj[k]/t*100)+'%');}).join('');
}
function splitBar(parts){
  var t=0;parts.forEach(function(p){t+=p.v;});
  if(!t)return '<div class="empty">No answers yet.</div>';
  var bar='<div class="split">'+parts.filter(function(p){return p.v>0;}).map(function(p){
    return '<div style="flex:'+p.v+';background:'+p.c+(p.dark?';color:#1B2B1F':'')+'">'+Math.round(p.v/t*100)+'%</div>';}).join('')+'</div>';
  var leg='<div class="legend">'+parts.map(function(p){return '<span><span class="sw" style="background:'+p.c+'"></span>'+esc(p.l)+' <b>'+num(p.v)+'</b></span>';}).join('')+'</div>';
  return bar+leg;
}

var DATA=null, SIG='', CLOCK=null, LAST=null, LAST_DAY='';
var F={q:'',period:'all',from:'',to:'',region:'',district:'',gender:'',age:'',vol:''};
var AGE_BANDS=['Under 16','16 to 17','18 to 24','25 to 35','36 and over'];
var GENDER={F:'Female',M:'Male',P:'Prefer not to say'};
var MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var USE_LABELS=['Registered and used it','Registered but not used','Did not register'];
var FORM_NAMES={registration:'Registrations',wave1:'Wave 1 surveys',wave2:'Wave 2 surveys',facebook:'Facebook form sign-ups'};
var FORMS=['registration','wave1','wave2','facebook'];
var VOL_INFO={};
/* ---- one volunteer, many spellings ---- */
var JUNK_NAME=/^(yes|no|n a|na|none|nil|test|ok)$/;
function nameKey(s){return String(s||'').toLowerCase().replace(/[\u2018\u2019`]/g,"'").replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ').trim();}
function lev(a,b){
  var p=[],i,j;for(j=0;j<=b.length;j++)p[j]=j;
  for(i=1;i<=a.length;i++){var c=[i];for(j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}
  return p[b.length];
}
/* Same number of names and exactly one of them off by one letter (Kefuwe / Kefuoe). */
function oneTypo(ta,tb){
  if(ta.length!==tb.length)return false;
  var diff=0;
  for(var i=0;i<ta.length;i++){if(ta[i]!==tb[i]){if(ta[i].length<5||tb[i].length<5||lev(ta[i],tb[i])>1)return false;diff++;}}
  return diff===1;
}
/* ---- the official volunteer list ---- */
var NOT_LISTED='Not on the volunteer list';
function roster(){return (DATA.config&&DATA.config.volunteers)||[];}
/* Gives every registration the official volunteer it belongs to, matching misspellings,
   a missing surname or middle name. Names that match nobody on the list become NOT_LISTED.
   The typed name stays searchable. */
function matchToRoster(){
  var R=roster().map(function(v){var k=nameKey(v.name).replace(/'/g,'');return {v:v,k:k,t:k.split(' ')};});
  var memo={};
  function pick(list,dists){
    if(list.length===1)return list[0];
    var near=list.filter(function(x){return dists[x.v.d];});
    return near.length===1?near[0]:null;
  }
  DATA.forms.registration.rows.forEach(function(r){
    r.v0=r.v||'';if(!r.v)return;
    var k=nameKey(r.v).replace(/'/g,'');
    memo[k]=memo[k]||{d:{},rows:[]};
    if(r.d>=0)memo[k].d[r.d]=1;
    memo[k].rows.push(r);
  });
  Object.keys(memo).forEach(function(k){
    var t=k.split(' '),m=null,dists=memo[k].d;
    if(k.replace(/[^a-z]/g,'').length>=2&&!JUNK_NAME.test(k)){
      m=pick(R.filter(function(x){return x.k===k;}),dists);
      if(!m&&t.length>=2)m=pick(R.filter(function(x){
        return (x.t[0]===t[0]&&x.t[x.t.length-1]===t[t.length-1])||oneTypo(t,x.t);}),dists);
      if(!m&&t.length===1)m=pick(R.filter(function(x){
        return x.t[0]===t[0]||(t[0].length>=5&&lev(x.t[0],t[0])<=1);}),dists);
    }
    memo[k].rows.forEach(function(r){r.v=m?m.v.name:NOT_LISTED;});
  });
}
/* Gives every registration's volunteer one agreed spelling. The typed name stays searchable. */
function mergeVolunteerNames(){
  var rows=DATA.forms.registration.rows,K={};
  rows.forEach(function(r){
    r.v0=r.v||'';if(!r.v)return;
    var k=nameKey(r.v);
    if(k.replace(/[^a-z]/g,'').length<2||JUNK_NAME.test(k)){r.v='';return;}
    var x=K[k]=K[k]||{n:0,d:{},show:{},t:k.split(' ')};
    x.n++;if(r.d>=0)x.d[r.d]=1;x.show[r.v]=(x.show[r.v]||0)+1;r._vk=k;
  });
  var keys=Object.keys(K),P={};
  keys.forEach(function(k){P[k]=k;});
  function find(k){while(P[k]!==k){P[k]=P[P[k]];k=P[k];}return k;}
  function join(a,b){a=find(a);b=find(b);if(a!==b)P[b]=a;}
  // full names: same first and last name (a middle name added or left out), or one small typo
  keys.forEach(function(a,i){keys.slice(i+1).forEach(function(b){
    var ta=K[a].t,tb=K[b].t;
    if((ta.length>=2&&tb.length>=2&&ta[0]===tb[0]&&ta[ta.length-1]===tb[tb.length-1])||oneTypo(ta,tb))join(a,b);
  });});
  // a first name alone joins the one full name that starts with it (if several, the one in the same district)
  var GD={};
  keys.forEach(function(k){var g=find(k);GD[g]=GD[g]||{};Object.keys(K[k].d).forEach(function(d){GD[g][d]=1;});});
  keys.filter(function(k){return K[k].t.length===1;}).forEach(function(s){
    var cand={},near={};
    keys.forEach(function(k){
      if(K[k].t.length<2)return;
      var f=K[k].t[0];
      if(f!==s&&!(s.length>=5&&lev(f,s)<=1))return;
      var g=find(k);
      cand[g]=1;
      if(Object.keys(K[s].d).some(function(d){return GD[g][d];}))near[g]=1;
    });
    var c=Object.keys(cand),n=Object.keys(near);
    if(c.length===1)join(c[0],s);else if(n.length===1)join(n[0],s);
  });
  // the spelling shown: a full name before a first name alone, then the most used
  var best={};
  keys.forEach(function(k){
    var g=find(k),x=K[k],b=best[g];
    if(!b||(x.t.length>=2)>(b.t.length>=2)||((x.t.length>=2)===(b.t.length>=2)&&x.n>b.n))best[g]=x;
  });
  var CANON={};
  Object.keys(best).forEach(function(g){
    var sh=best[g].show,top='';Object.keys(sh).forEach(function(v){if(!top||sh[v]>sh[top])top=v;});
    CANON[g]=top;
  });
  rows.forEach(function(r){if(r._vk)r.v=CANON[find(r._vk)];});
}
/* Each district's target is shared equally by the volunteers working there
   (with the official list: the district they are listed for; without it: where they registered the most youth). */
function volunteerTargets(){
  var seen={},inD={};
  if(roster().length){
    VOL_INFO={};
    roster().forEach(function(v){if(v.d>=0)inD[v.d]=(inD[v.d]||0)+1;});
    roster().forEach(function(v){
      var n=v.d>=0?inD[v.d]:0;
      VOL_INFO[v.name.toLowerCase()]={d:v.d,n:n,target:n?DATA.districts[v.d].target/n:0};
    });
    return;
  }
  DATA.forms.registration.rows.forEach(function(r){
    if(!r.v)return;var k=r.v.toLowerCase();
    seen[k]=seen[k]||{};if(DATA.districts[r.d])bump(seen[k],r.d);
  });
  VOL_INFO={};
  Object.keys(seen).forEach(function(k){
    var best=-1,bestN=0;
    Object.keys(seen[k]).forEach(function(i){if(seen[k][i]>bestN){best=+i;bestN=seen[k][i];}});
    VOL_INFO[k]={d:best};if(best>=0)inD[best]=(inD[best]||0)+1;
  });
  Object.keys(VOL_INFO).forEach(function(k){
    var x=VOL_INFO[k];x.n=x.d>=0?inD[x.d]:0;x.target=x.n?DATA.districts[x.d].target/x.n:0;
  });
}
function volInfo(name){return VOL_INFO[String(name).toLowerCase()]||{d:-1,n:0,target:0};}
/* A volunteer target is exactly 500 divided by the volunteers in the district, to 2 decimals (500/3 = 166.67). */
function targetValue(t){return Math.round(t*100)/100;}
function targetLabel(t){return targetValue(t).toLocaleString('en-US',{maximumFractionDigits:2});}

function ageBand(n){
  if(!(n>=0))return null;
  if(n<16)return 'Under 16';
  if(n<18)return '16 to 17';
  if(n<25)return '18 to 24';
  if(n<36)return '25 to 35';
  return '36 and over';
}
function bump(o,k,n){o[k]=(o[k]||0)+(n||1);}
function dayLabel(key){var p=String(key).split('-');return p.length<3?key:(+p[2])+' '+MONTH_NAMES[+p[1]-1]+' '+p[0];}
function whenLabel(t){var p=String(t).split(' ');var d=p[0].split('-');return d.length<3?t:(+d[2])+' '+MONTH_NAMES[+d[1]-1]+' '+(p[1]||'');}
function monthLabel(key){var p=key.split('-');return MONTH_NAMES[+p[1]-1];}
function addDays(key,n){var d=new Date(key+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function lastDayOf(mk){var p=mk.split('-');var d=new Date(Date.UTC(+p[0],+p[1],0));return d.toISOString().slice(0,10);}
function nextMonth(mk){var p=mk.split('-');var y=+p[0],m=+p[1]+1;if(m>12){m=1;y++;}return y+'-'+(m<10?'0':'')+m;}
function stamp(key,time){return new Date(key+'T'+(time||'00:00')+':00Z').getTime();}
/* Share of the plan that should be done by a moment ('yyyy-MM-dd HH:mm'): straight line from start to end. */
function planFrac(at){
  var c=DATA.config,s=stamp(c.planStart,'00:00'),e=stamp(c.planEnd,'23:59')+60000;
  var p=String(at).split(' '),t=stamp(p[0],p[1]||'23:59');
  return Math.max(0,Math.min(1,(t-s)/(e-s)));
}

function prepare(){
  if(DATA.forms.registration){if(roster().length)matchToRoster();else mergeVolunteerNames();}
  FORMS.forEach(function(k){
    if(!DATA.forms[k])DATA.forms[k]={headers:[],rows:[]};
    var f=DATA.forms[k];
    f.hasAge=f.rows.some(function(r){return r.a!=null;});
    f.hasVol=f.rows.some(function(r){return !!r.v;});
    f.rows.forEach(function(r){
      var d=DATA.districts[r.d],rg=d?regionOf(d.region):null;
      var bits=[d?d.name:'',d?d.region:'',rg?rg.coordinator:'',GENDER[r.g]||'',r.a!=null?String(r.a):'',ageBand(r.a)||'',r.v||'',r.v0&&r.v0!==r.v?r.v0:'',r.t||'',
        r.buy||'',r.use>=0?USE_LABELS[r.use]:'',(r.prob||[]).join(' '),r.idea||'',(r.dis||[]).join(' ')];
      (r.o||[]).forEach(function(x){bits.push(x[1]);});
      r._s=bits.join(' \u0001 ').toLowerCase();
      r._day=(r.t||'').slice(0,10);
    });
  });
  volunteerTargets();
}
function regionOf(name){for(var i=0;i<DATA.regions.length;i++){if(DATA.regions[i].name===name)return DATA.regions[i];}return null;}
function words(){return F.q.toLowerCase().split(/\s+/).filter(function(w){return w.length>0;});}
function dateRange(){
  var today=CLOCK?CLOCK.todayKey:'';
  if(F.period==='today')return [today,today];
  if(F.period==='yesterday'){var y=addDays(today,-1);return [y,y];}
  if(F.period==='7')return [addDays(today,-6),today];
  if(F.period==='30')return [addDays(today,-29),today];
  if(F.period==='month')return [today.slice(0,8)+'01',today];
  if(F.period==='custom')return [F.from||'',F.to||''];
  return ['',''];
}
function selectedDistricts(){
  return DATA.districts.map(function(d,i){return i;}).filter(function(i){
    var d=DATA.districts[i];
    if(F.district!=='')return String(i)===F.district;
    if(F.region)return d.region===F.region;
    return true;
  });
}
function filtered(kind,opts){
  opts=opts||{};
  var f=DATA.forms[kind],rg=dateRange(),w=opts.noSearch?[]:words();
  var allD=F.region===''&&F.district==='',sel={};
  selectedDistricts().forEach(function(i){sel[i]=1;});
  return f.rows.filter(function(r){
    if(!allD&&!sel[r.d])return false;
    if(F.gender&&r.g!==F.gender)return false;
    if(F.age&&f.hasAge&&ageBand(r.a)!==F.age)return false;
    if(F.vol&&f.hasVol&&String(r.v||'').toLowerCase()!==F.vol)return false;
    if(!opts.noDates&&(rg[0]||rg[1])){
      if(!r._day)return false;
      if(rg[0]&&r._day<rg[0])return false;
      if(rg[1]&&r._day>rg[1])return false;
    }
    for(var i=0;i<w.length;i++){if(r._s.indexOf(w[i])<0)return false;}
    return true;
  });
}

function analyseReg(rows){
  var out={total:0,today:0,byDistrict:{},byMonth:{},gender:{},ages:{},finished:{Yes:0,'Not yet':0},contactOk:{Yes:0,No:0},
    under16:0,under16WithConsent:0,difficulty:{any:0,types:{}},volunteers:[],latest:[],regions:{}};
  var vols={},todayKey=CLOCK.todayKey;
  rows.forEach(function(r){
    out.total++;
    var d=DATA.districts[r.d],rgn=null;
    if(d){
      bump(out.byDistrict,r.d);
      rgn=out.regions[d.region]=out.regions[d.region]||{today:0,byMonth:{},female:0,male:0,finishedYes:0,finishedAll:0,vols:{}};
      if(r.v&&r.v!==NOT_LISTED)rgn.vols[r.v.toLowerCase()]=1;
      if(r.g==='F')rgn.female++;else if(r.g==='M')rgn.male++;
      if(r.fin){rgn.finishedAll++;if(r.fin==='Y')rgn.finishedYes++;}
    }
    if(r.t){
      var mk=r.t.slice(0,7);
      bump(out.byMonth,mk);if(rgn)bump(rgn.byMonth,mk);
      if(r._day===todayKey){out.today++;if(rgn)rgn.today++;}
    }
    bump(out.gender,GENDER[r.g]||'Prefer not to say');
    var band=ageBand(r.a);if(band)bump(out.ages,band);
    if(r.a<16){out.under16++;if(r.con)out.under16WithConsent++;}
    if(r.dis&&r.dis.length){out.difficulty.any++;r.dis.forEach(function(x){bump(out.difficulty.types,x);});}
    if(r.fin==='Y')out.finished.Yes++;else if(r.fin==='N')out.finished['Not yet']++;
    if(r.ok==='Y')out.contactOk.Yes++;else if(r.ok==='N')out.contactOk.No++;
    if(r.v){
      var vk=r.v.toLowerCase();
      if(!vols[vk])vols[vk]={name:r.v,count:0,districts:{}};
      vols[vk].count++;if(d)bump(vols[vk].districts,r.d);
    }
  });
  out.volunteers=Object.keys(vols).map(function(k){
    var v=vols[k],best=-1,bestN=0;
    Object.keys(v.districts).forEach(function(i){if(v.districts[i]>bestN){best=i;bestN=v.districts[i];}});
    return {name:v.name,count:v.count,district:DATA.districts[best]?DATA.districts[best].name:''};
  }).sort(function(a,b){return b.count-a.count||a.name.localeCompare(b.name);});
  out.latest=rows.filter(function(r){return r.t;}).sort(function(a,b){return a.t<b.t?1:a.t>b.t?-1:0;}).slice(0,8).map(function(r){
    var d=DATA.districts[r.d];return {district:d?d.name:'District not set',when:whenLabel(r.t)};
  });
  return out;
}
function analyseW1(rows){
  var out={total:0,byDistrict:{},gender:{},buy:{},heard:{Yes:0,No:0},under16:0};
  rows.forEach(function(r){
    out.total++;if(DATA.districts[r.d])bump(out.byDistrict,r.d);
    bump(out.gender,GENDER[r.g]||'Prefer not to say');
    if(r.a<16)out.under16++;
    if(r.buy)bump(out.buy,r.buy);
    if(r.heard==='Y')out.heard.Yes++;else if(r.heard==='N')out.heard.No++;
  });
  return out;
}
function analyseW2(rows){
  var labels=['Registered and used it','Registered but not used','Did not register'];
  var out={total:0,byDistrict:{},gender:{},usage:{'Registered and used it':0,'Registered but not used':0,'Did not register':0},problems:{},ideas:[]};
  rows.forEach(function(r){
    out.total++;if(DATA.districts[r.d])bump(out.byDistrict,r.d);
    bump(out.gender,GENDER[r.g]||'Prefer not to say');
    if(r.use>=0)out.usage[labels[r.use]]++;
    (r.prob||[]).forEach(function(p){bump(out.problems,p);});
    if(r.idea){var d=DATA.districts[r.d];out.ideas.push({text:r.idea,district:d?d.name:''});}
  });
  out.ideas=out.ideas.slice(-6).reverse();
  return out;
}

function buildView(){
  var c=DATA.config,rg=dateRange();
  var regRows=filtered('registration'),w1Rows=filtered('wave1'),w2Rows=filtered('wave2'),fbRows=filtered('facebook');
  var r=analyseReg(regRows),a=analyseW1(w1Rows),b=analyseW2(w2Rows);
  var sel=selectedDistricts();
  var nowAt=CLOCK.nowKey,frac=planFrac(nowAt);
  var districts=sel.map(function(i){
    var d=DATA.districts[i];
    return {i:i,name:d.name,region:d.region,target:d.target,count:r.byDistrict[i]||0,wave1:a.byDistrict[i]||0,wave2:b.byDistrict[i]||0};
  });
  var totalTarget=districts.reduce(function(t,d){return t+d.target;},0);
  // months from the plan start to the later of the plan end and this month
  var keys=[],mk=c.planStart.slice(0,7),last=c.planEnd.slice(0,7),nowMk=CLOCK.todayKey.slice(0,7);
  if(nowMk>last)last=nowMk;
  while(mk<=last&&keys.length<24){keys.push(mk);mk=nextMonth(mk);}
  var monthFrac=keys.map(function(k){return planFrac(lastDayOf(k)+' 23:59');});
  var regions=DATA.regions.map(function(rgn){
    var ds=districts.filter(function(d){return d.region===rgn.name;});
    if(!ds.length)return null;
    var target=ds.reduce(function(t,d){return t+d.target;},0);
    var x=r.regions[rgn.name]||{today:0,byMonth:{},female:0,male:0,finishedYes:0,finishedAll:0,vols:{}};
    return {name:rgn.name,coordinator:rgn.coordinator,districts:ds.length,target:target,
      count:ds.reduce(function(t,d){return t+d.count;},0),expected:Math.round(target*frac),
      wave1:ds.reduce(function(t,d){return t+d.wave1;},0),wave2:ds.reduce(function(t,d){return t+d.wave2;},0),
      today:x.today,byMonth:x.byMonth,female:x.female,male:x.male,finishedYes:x.finishedYes,finishedAll:x.finishedAll,
      volunteers:Object.keys(x.vols||{}).length,
      planByMonth:monthFrac.map(function(f){return Math.round(target*f);})};
  }).filter(Boolean);
  var daysLeft=Math.round((stamp(c.planEnd)-stamp(CLOCK.todayKey))/86400000)+1;
  var left=Math.max(0,totalTarget-r.total);
  if(roster().length){
    var have={},selD={};
    r.volunteers.forEach(function(x){have[x.name.toLowerCase()]=1;});
    sel.forEach(function(i){selD[i]=1;});
    if(!F.q)roster().forEach(function(x){
      var k=x.name.toLowerCase();
      if(have[k]||!selD[x.d]||(F.vol&&F.vol!==k))return;
      r.volunteers.push({name:x.name,count:0,district:DATA.districts[x.d]?DATA.districts[x.d].name:''});
    });
    r.volunteers.sort(function(p,q){return (p.name===NOT_LISTED)-(q.name===NOT_LISTED)||q.count-p.count||p.name.localeCompare(q.name);});
  }
  return {
    today:CLOCK.today,updated:CLOCK.updated,missing:DATA.missing,errors:DATA.errors,check:DATA.check,
    totalTarget:totalTarget,expectedByNow:Math.round(totalTarget*frac),planStarted:nowAt>=c.planStart,
    planStartLabel:dayLabel(c.planStart).replace(/ \d{4}$/,''),planEndLabel:dayLabel(c.planEnd),
    daysLeft:daysLeft,perDayNeeded:daysLeft>0?Math.ceil(left/daysLeft):0,
    dateFiltered:!!(rg[0]||rg[1]),districtTarget:c.districtTarget,
    monthNow:CLOCK.todayKey.slice(0,7),volunteerTarget:c.volunteerTarget,
    monthKeys:keys,months:keys.map(monthLabel),plan:monthFrac.map(function(f){return Math.round(totalTarget*f);}),
    districts:districts,allDistricts:DATA.districts,regions:regions,registration:r,wave1:a,wave2:b,facebook:analyseReg(fbRows),
    rows:{registration:regRows,wave1:w1Rows,wave2:w2Rows,facebook:fbRows}
  };
}

/* What the search words matched, as question → answer → how many. Never names or phone numbers. */
function searchHits(v){
  var w=words();if(!w.length)return null;
  var hits={};
  function hit(q,val){
    var low=String(val).toLowerCase();
    for(var i=0;i<w.length;i++){if(low.indexOf(w[i])>=0){bump(hits,q+'\u0002'+String(val).slice(0,120));return;}}
  }
  FORMS.forEach(function(k){
    var H=DATA.forms[k].headers,pre=k==='facebook'?'Facebook form: ':'';
    v.rows[k].forEach(function(r){
      var d=DATA.districts[r.d];
      if(d){hit(pre+'District',d.name);hit(pre+'Region',d.region+' ('+(regionOf(d.region)||{}).coordinator+')');}
      if(r.v)hit('Volunteer',r.v);
      hit(pre+'Gender',GENDER[r.g]||'');
      if(ageBand(r.a))hit(pre+'Age group',ageBand(r.a));
      (r.dis||[]).forEach(function(x){hit(pre+'Difficulty',x);});
      if(r.buy)hit('Wave 1: what they would buy first',r.buy);
      if(r.use>=0)hit('Wave 2: registered and used YOMA',USE_LABELS[r.use]);
      (r.prob||[]).forEach(function(x){hit('Wave 2: problems they had',x);});
      if(r.idea)hit('Wave 2: what would make YOMA better',r.idea);
      (r.o||[]).forEach(function(x){
        var q=H[x[0]];if(!q)return;
        hit(FORM_NAMES[k].replace(/s$/,'')+': '+q.replace(/\s+/g,' '),x[1]);
      });
    });
  });
  return Object.keys(hits).map(function(k){var p=k.split('\u0002');return {q:p[0],a:p[1],n:hits[k]};})
    .sort(function(x,y){return y.n-x.n;});
}
function searchPanel(v,hits){
  var total=v.registration.total+v.wave1.total+v.wave2.total+v.facebook.total;
  var top=(hits||[]).slice(0,15);
  var rows=top.map(function(h){return '<tr><td>'+esc(h.q)+'</td><td>'+esc(h.a)+'</td><td>'+num(h.n)+'</td></tr>';}).join('');
  return '<div class="panel wide sres"><h2>Search: “'+esc(F.q)+'”</h2>'+
    '<div class="hint">Found in <b>'+num(v.registration.total)+'</b> registrations, <b>'+num(v.wave1.total)+'</b> Wave 1 and <b>'+num(v.wave2.total)+'</b> Wave 2 answers, and <b>'+num(v.facebook.total)+'</b> Facebook form sign-ups (kept separate). Everything on this page now counts only these answers.</div>'+
    (total&&rows?'<table class="cmp"><tr><th>Where it was found</th><th>Answer</th><th>Answers</th></tr>'+rows+'</table>':
     '<div class="empty">Nothing matches. Try fewer or shorter words, for example a district, a volunteer or one word from an answer.</div>')+
    '<div class="hint" style="margin-top:8px">Names and phone numbers of young people are never searched or shown.</div></div>';
}

  h2c:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};
var loaded={};
function loadScript(url){
  if(loaded[url])return loaded[url];
  loaded[url]=new Promise(function(ok,bad){
    var s=document.createElement('script');s.src=url;s.onload=ok;
    s.onerror=function(){delete loaded[url];bad(new Error('Could not load the download tool. Check the internet connection.'));};
    document.head.appendChild(s);
  });
  return loaded[url];
}
function fileStamp(){return (CLOCK?CLOCK.todayKey:'report');}
function busy(msg){var b=document.getElementById('dlBtn');b.disabled=!!msg;b.textContent=msg||'Download ▾';}
function saveBlob(blob,name){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);
}
function filterText(){var a=filterSummary();return a.length?a.map(function(x){return x.l;}).join(' · '):'All data, no filters';}

function downloadPdf(){
  if(!LAST){alert('Wait for the numbers to load first.');return;}
  busy('Making PDF…');
  Promise.all([loadScript(LIBS.h2c),loadScript(LIBS.pdf)]).then(function(){
    var main=document.querySelector('main');
    var head=document.createElement('div');head.className='rhead';head.id='rhead';
    head.innerHTML='<div class="eb">PLANT ONE TREE · UNICEF LESOTHO · YOMA LESOTHO</div><h1>YOMA Lesotho Analytics: roadshow report</h1>'+
      '<div>'+esc(CLOCK.today)+' at '+esc(CLOCK.updated)+'</div><div><b>Filters:</b> '+esc(filterText())+'</div>';
    main.insertBefore(head,main.firstChild);
    document.body.classList.add('report');
    window.scrollTo(0,0);
    return new Promise(function(r){setTimeout(r,250);}).then(function(){
      return html2canvas(main,{scale:2,backgroundColor:'#F2F6EC',useCORS:true,logging:false,windowWidth:1100});
    }).then(function(canvas){
      // places where the page may break: below each block, never through one
      var top=main.getBoundingClientRect().top,blocks=[];
      main.querySelectorAll('#rhead,.banner,.kpis,.panel').forEach(function(el){
        if(el.offsetParent===null)return;
        var b=el.getBoundingClientRect();blocks.push([b.top-top,b.bottom-top]);
      });
      var cssH=main.scrollHeight,cssW=main.scrollWidth,k=canvas.width/cssW;
      var JS=window.jspdf.jsPDF,doc=new JS({unit:'mm',format:'a4',orientation:'portrait'});
      var mm=190/cssW,pageCss=270/mm,y=0,pages=[];
      while(y<cssH-2){
        var limit=y+pageCss,cut=Math.min(limit,cssH);
        if(limit<cssH){
          var best=0;
          blocks.forEach(function(b){
            var c=b[1]+6;
            if(c>y+40&&c<=limit&&!blocks.some(function(o){return o[0]<c-1&&o[1]>c+1;}))best=Math.max(best,c);
          });
          if(best)cut=best;
        }
        pages.push([y,cut]);y=cut;
      }
      pages.forEach(function(p,i){
        if(i)doc.addPage();
        var h=Math.round((p[1]-p[0])*k),part=document.createElement('canvas');
        part.width=canvas.width;part.height=Math.max(1,h);
        part.getContext('2d').drawImage(canvas,0,Math.round(p[0]*k),canvas.width,h,0,0,canvas.width,h);
        doc.addImage(part.toDataURL('image/jpeg',0.92),'JPEG',10,10,190,(p[1]-p[0])*mm);
        doc.setFontSize(8);doc.setTextColor(90);
        doc.text('YOMA Lesotho Analytics · '+CLOCK.today+' · page '+(i+1)+' of '+pages.length,105,291,{align:'center'});
      });
      saveBlob(doc.output('blob'),'YOMA-report-'+fileStamp()+'.pdf');
    });
  }).catch(function(e){alert('PDF download failed: '+(e&&e.message?e.message:e));})
  .then(function(){
    document.body.classList.remove('report');
    var h=document.getElementById('rhead');if(h)h.remove();
    busy('');
  });
}

function downloadExcel(){
  if(!LAST){alert('Wait for the numbers to load first.');return;}
  busy('Making Excel…');
  loadScript(LIBS.xlsx).then(function(){
    var v=LAST.view,r=v.registration,a=v.wave1,b=v.wave2,wb=XLSX.utils.book_new();
    function pct(x,t){return t?Math.round(x/t*100)+'%':'';}
    function sheet(name,rows,widths){
      var ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=(widths||[]).map(function(w){return {wch:w};});
      XLSX.utils.book_append_sheet(wb,ws,name);
    }
    function pairs(title,obj,order){
      var keys=(order||[]).slice();Object.keys(obj).forEach(function(k){if(keys.indexOf(k)<0)keys.push(k);});
      var t=0;keys.forEach(function(k){t+=obj[k]||0;});
      return [[title,'Count','Share']].concat(keys.filter(function(k){return obj[k];}).map(function(k){return [k,obj[k],pct(obj[k],t)];})).concat([[]]);
    }
    var diff=r.total-v.expectedByNow;
    sheet('Summary',[
      ['YOMA Lesotho Analytics: roadshow report'],['Plant One Tree · UNICEF Lesotho · YOMA Lesotho'],
      ['Made on',CLOCK.today+' '+CLOCK.updated],['Filters',filterText()],[],
      ['Measure','Value'],
      ['Youth registered',r.total],['Target by '+v.planEndLabel,v.totalTarget],['Share of target',pct(r.total,v.totalTarget)],
      ['Plan by today',v.dateFiltered?'':v.expectedByNow],['Ahead (+) or behind (-) plan',v.dateFiltered?'':diff],
      ['Needed per day to reach target',v.dateFiltered?'':v.perDayNeeded],
      ['Registered today',r.today],['Wave 1 surveys',a.total],['Wave 2 surveys',b.total],
      ['Facebook form sign-ups (kept separate, not in the numbers above)',v.facebook.total],[],
      ['Totals only. No names or phone numbers of young people are in this file.']
    ],[34,44]);
    sheet('Districts',[['District','Region','Coordinator','Registered','Target','Share of target','Wave 1','Wave 2']].concat(
      v.districts.map(function(d){return [d.name,d.region,(regionOf(d.region)||{}).coordinator||'',d.count,d.target,pct(d.count,d.target),d.wave1,d.wave2];})),[16,10,14,12,10,15,9,9]);
    sheet('Coordinators',[['Region','Coordinator','Registered','Target','Share of target','Plan by today','Ahead or behind','Registered today','Volunteers reporting','Finished on YOMA','Girls and young women','Wave 1','Wave 2']].concat(
      v.regions.map(function(g){return [g.name,g.coordinator,g.count,g.target,pct(g.count,g.target),v.dateFiltered?'':g.expected,v.dateFiltered?'':g.count-g.expected,g.today,g.volunteers,pct(g.finishedYes,g.finishedAll),pct(g.female,g.female+g.male),g.wave1,g.wave2];})),[10,14,11,9,14,13,15,15,19,16,20,8,8]);
    var cum=0;
    sheet('By month',[['Month','Registered in month','Running total','Plan (running total)']].concat(
      v.monthKeys.map(function(k,i){cum+=r.byMonth[k]||0;return [v.months[i]+' '+k.slice(0,4),r.byMonth[k]||0,cum,v.plan[i]];})),[12,20,15,22]);
    sheet('Volunteers',[['Volunteer','District','Volunteers in that district','Youth registered','Target','Share of target']].concat(
      r.volunteers.map(function(x){var vi=volInfo(x.name);return [x.name,vi.d>=0?DATA.districts[vi.d].name:'',vi.n||'',x.count,vi.target?targetValue(vi.target):'',vi.target?pct(x.count,vi.target):''];})),[24,16,24,16,8,15]);
    sheet('Who registered',[].concat(pairs('Gender',r.gender,['Female','Male','Prefer not to say']),pairs('Age',r.ages,AGE_BANDS),
      pairs('Difficulty',r.difficulty.types,[]),[['Young people with any difficulty',r.difficulty.any],[]],
      pairs('Finished registering on YOMA',r.finished,['Yes','Not yet']),pairs('OK to contact',r.contactOk,['Yes','No']),
      [['Under 16',r.under16],['Under 16 with a parent or guardian named',r.under16WithConsent]]),[40,10,10]);
    sheet('Wave 1',[].concat(pairs('What they would buy first',a.buy,[]),pairs('Heard of YOMA before',a.heard,['Yes','No']),pairs('Gender',a.gender,['Female','Male','Prefer not to say'])),[40,10,10]);
    sheet('Wave 2',[].concat(pairs('Registered and used YOMA',b.usage,['Registered and used it','Registered but not used','Did not register']),
      pairs('Problems they had',b.problems,[]),[['What would make YOMA better','District']],
      v.rows.wave2.filter(function(x){return x.idea;}).map(function(x){var d=DATA.districts[x.d];return [x.idea,d?d.name:''];})),[60,16,10]);
    var fb=v.facebook;
    sheet('Facebook form',[['Facebook form sign-ups'],['Kept separate: not part of the volunteer registrations, targets or coordinator numbers.'],[],
      ['Sign-ups',fb.total],['Today',fb.today],[],['District','Region','Sign-ups']].concat(
      v.districts.map(function(d){return [d.name,d.region,fb.byDistrict[d.i]||0];}),[[]],
      pairs('Gender',fb.gender,['Female','Male','Prefer not to say']),pairs('Age',fb.ages,AGE_BANDS),
      pairs('Difficulty',fb.difficulty.types,[]),[['Young people with any difficulty',fb.difficulty.any],[]],
      pairs('Finished registering on YOMA',fb.finished,['Yes','Not yet']),pairs('OK to contact',fb.contactOk,['Yes','No']),
      [['Under 16',fb.under16],['Under 16 with a parent or guardian named',fb.under16WithConsent]]),[40,12,10]);
    if(F.q&&LAST.hits)sheet('Search',[['Search',F.q],[],['Where it was found','Answer','Answers']].concat(LAST.hits.map(function(h){return [h.q,h.a,h.n];})),[50,40,10]);
    var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    saveBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'YOMA-numbers-'+fileStamp()+'.xlsx');
  }).catch(function(e){alert('Excel download failed: '+(e&&e.message?e.message:e));})
  .then(function(){busy('');});
}

/* ---------- wiring ---------- */
(function(){
  var fp=document.getElementById('fpanel');
  if(window.innerWidth<560){fp.classList.remove('open');document.getElementById('fBtn').setAttribute('aria-expanded','false');}
  fp.addEventListener('change',function(){readControls();refresh();});
  document.getElementById('sForm').onsubmit=function(ev){ev.preventDefault();F.q=document.getElementById('q').value.trim();refresh();};
  document.getElementById('q').addEventListener('search',function(){if(!this.value&&F.q){F.q='';refresh();}});
  document.getElementById('fBtn').onclick=function(){var open=fp.classList.toggle('open');this.setAttribute('aria-expanded',open);};
  document.getElementById('active').addEventListener('click',function(ev){
    var t=ev.target.closest('button');if(!t)return;
    if(t.id==='fClear')F={q:'',period:'all',from:'',to:'',region:'',district:'',gender:'',age:'',vol:''};
    else clearKey(t.getAttribute('data-k'));
    setControls();refresh();
  });
  var menu=document.getElementById('dlMenu');
  document.getElementById('dlBtn').onclick=function(ev){ev.stopPropagation();menu.classList.toggle('open');};
  document.addEventListener('click',function(){menu.classList.remove('open');});
  menu.addEventListener('click',function(ev){
    var t=ev.target.closest('button');if(!t)return;menu.classList.remove('open');
    if(t.getAttribute('data-dl')==='pdf')downloadPdf();else downloadExcel();
  });
})();

function fail(err){
  document.getElementById('dot').className='dot off';
  document.getElementById('status').textContent='Cannot load: '+(err&&err.message?err.message:err);
}
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function call(fn,args,ok,bad){
  if(IS_GAS){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(bad);r[fn].apply(r,args);return;}
  if(!API_URL||API_URL.indexOf('PASTE')===0){bad(new Error('Paste your web app link into API_URL in index.html'));return;}
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){return r.json();})
    .then(function(j){if(j.error)bad(new Error(j.error));else ok(j.result);})
    .catch(bad);
}
function getTok(){try{return localStorage.getItem('yomaTok')||'';}catch(e){return '';}}
function setTok(v){try{if(v)localStorage.setItem('yomaTok',v);else localStorage.removeItem('yomaTok');}catch(e){}}
var TOKEN=getTok();

function showLogin(msg){
  if(timer){clearInterval(timer);timer=null;}
  document.body.classList.add('locked');
  document.getElementById('lgErr').textContent=msg||'';
  document.getElementById('lgGo').disabled=false;
  document.getElementById('lgGo').textContent='Sign in';
}
function startDashboard(){
  document.body.classList.remove('locked');
  load();
  if(timer)clearInterval(timer);
  timer=setInterval(load,EVERY);
}
function loadFail(err){
  var m=err&&err.message?err.message:String(err);
  if(m.indexOf('SIGN_IN_NEEDED')>=0){TOKEN='';setTok('');showLogin('Please sign in again.');return;}
  fail(err);
}
function load(){
  if(document.hidden||!TOKEN)return;
  call('getData',[TOKEN,SIG],onData,loadFail);
}

// images from GitHub (logo.png, background.png), with built-in fallbacks
(function(){
  var base=IS_GAS?IMG_BASE:'';
  if(!IS_GAS||base){
    var lg=document.getElementById('lgLogo'),fallback=lg.src;
    lg.onerror=function(){lg.onerror=null;lg.src=fallback;};
    lg.src=base+'logo.png';
    var bg=new Image();
    bg.onload=function(){document.getElementById('login').style.setProperty('--bgimg','url("'+bg.src+'")');};
    bg.src=base+'background.png';
  }
})();

document.getElementById('lgShow').onclick=function(){
  var p=document.getElementById('lgPass');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'Show':'Hide';
};
document.getElementById('lgForm').onsubmit=function(ev){
  ev.preventDefault();
  var u=document.getElementById('lgUser').value,p=document.getElementById('lgPass').value;
  var b=document.getElementById('lgGo');b.disabled=true;b.textContent='Signing in…';
  document.getElementById('lgErr').textContent='';
  call('login',[u,p],function(tok){
    TOKEN=tok;setTok(tok);SIG='';document.getElementById('lgPass').value='';startDashboard();
  },function(err){
    var m=err&&err.message?err.message:String(err);
    showLogin(m.indexOf('Wrong')>=0?'Wrong username or password.':'Cannot sign in: '+m);
  });
};
document.getElementById('signOut').onclick=function(){
  if(TOKEN)call('logout',[TOKEN],function(){},function(){});
  TOKEN='';setTok('');SIG='';showLogin('');
};
document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
if(TOKEN)startDashboard();else showLogin('');
</script>
