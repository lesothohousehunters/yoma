<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOMA Lesotho Analytics</title>
<style>
:root{--dark:#1E4D2B;--mid:#3E7D23;--soft:#A9D18E;--pale:#E4F0D8;--bg:#F2F6EC;--line:#D5E2CC;--gold:#F2C14E;--ink:#1B2B1F;--muted:#4B6B52}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.35}
header{background:var(--dark);color:#fff;padding:18px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header img{width:64px;height:64px;border-radius:14px;background:#fff}
header .t{flex:1;min-width:240px}
header .eyebrow{font-size:12px;letter-spacing:2px;color:var(--soft);font-weight:700}
header h1{margin:2px 0 0;font-size:26px}
header .sub{color:var(--gold);font-size:14px}
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:#fff;background:rgba(255,255,255,.12);padding:8px 14px;border-radius:20px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite}
.dot.off{background:#c0c0c0;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,193,78,.7)}70%{box-shadow:0 0 0 10px rgba(242,193,78,0)}100%{box-shadow:0 0 0 0 rgba(242,193,78,0)}}
main{max-width:1240px;margin:0 auto;padding:20px 16px 40px}
.banner{background:#FFF6DA;border:1px solid var(--gold);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px;display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.kpi .v{font-size:34px;font-weight:800;color:var(--dark);line-height:1.1;margin-top:4px}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.dark{background:var(--dark);border-color:var(--dark)}
.kpi.dark .l,.kpi.dark .s{color:var(--soft)}
.kpi.dark .v{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}
.panel.wide{grid-column:1/-1}
.panel h2{margin:0 0 2px;font-size:18px;color:var(--dark)}
.panel .hint{font-size:13px;color:var(--muted);margin-bottom:12px}
.row{display:grid;grid-template-columns:150px 1fr 76px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.row .n{font-weight:600;display:flex;align-items:center;gap:6px}
.row .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:16px;background:var(--pale);border-radius:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--mid);border-radius:8px;transition:width .6s}
.bar i.over{background:var(--gold)}
.bar i.north{background:var(--dark)}.bar i.central{background:var(--mid)}.bar i.south{background:#7FB35C}
.chip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;background:var(--pale);color:var(--dark)}
.split{display:flex;height:34px;border-radius:10px;overflow:hidden;margin:8px 0 6px}
.split div{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.months{display:flex;gap:18px;align-items:flex-end;height:230px;padding:10px 0 0}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.mpair{display:flex;gap:6px;align-items:flex-end;width:100%;justify-content:center;flex:1}
.mb{width:46%;min-width:58px;max-width:78px;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:12px;font-weight:800;padding-top:4px;min-height:2px;transition:height .6s}
.mb.plan{background:transparent;border:2px dashed var(--mid);color:var(--mid)}
.mb.act{background:var(--dark);color:var(--gold)}
.mlab{font-size:13px;font-weight:700;margin-top:6px}
.list{max-height:360px;overflow:auto;padding-right:4px}
.latest{list-style:none;margin:0;padding:0;font-size:14px}
.latest li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--pale)}
.latest li:first-child{background:var(--pale);padding-left:8px;padding-right:8px;border-radius:8px}
.idea{padding:8px 0;border-bottom:1px solid var(--pale);font-size:14px}
.idea span{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}

.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.rc{border:2px solid var(--line);border-radius:16px;padding:16px;position:relative}
.rc.lead{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.25)}
.rc .who{font-size:12px;letter-spacing:1.5px;font-weight:800;color:var(--muted)}
.rc .nm{font-size:22px;font-weight:800;color:var(--dark)}
.rc .big{font-size:40px;font-weight:800;line-height:1.05;color:var(--dark);margin-top:6px}
.rc .big small{font-size:16px;font-weight:600;color:var(--muted)}
.rc .tag{position:absolute;top:14px;right:14px;background:var(--gold);color:#1B2B1F;font-size:12px;font-weight:800;border-radius:10px;padding:3px 10px}
.rc dl{margin:12px 0 0;display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}
.rc dt{color:var(--muted)}.rc dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.mini{display:flex;gap:8px;margin-top:12px}
.mini div{flex:1;text-align:center;background:var(--pale);border-radius:10px;padding:6px 2px;font-size:12px;color:var(--muted)}
.mini b{display:block;font-size:16px;color:var(--ink)}
.mini .ahead b{color:var(--mid)}.mini .behind b{color:#B3261E}
.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
.cmp th,.cmp td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--pale)}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.cmp .best{background:var(--pale);font-weight:800;border-radius:6px}

/* login */
body.locked>header,body.locked>main,body.locked>footer{display:none}
#login{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(rgba(8,28,14,.30),rgba(8,28,14,.55)),var(--bgimg,none) center/cover no-repeat,linear-gradient(135deg,#1E4D2B,#3E7D23 60%,#A9D18E)}
body.locked #login{display:flex}
.glass{width:100%;max-width:400px;padding:34px 28px 28px;border-radius:24px;text-align:center;color:#fff;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);box-shadow:0 20px 50px rgba(0,0,0,.28);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.glass img{height:96px;max-width:220px;object-fit:contain;background:#fff;border-radius:18px;padding:8px}
.glass h1{margin:18px 0 22px;font-size:24px;font-weight:800;letter-spacing:2.5px;line-height:1.2}
.glass label{display:block;text-align:left;font-size:13px;font-weight:700;letter-spacing:.5px;margin:0 0 6px}
.glass input{width:100%;font:inherit;font-size:16px;padding:12px 14px;margin-bottom:14px;border-radius:12px;color:#fff;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);outline:none}
.glass input::placeholder{color:rgba(255,255,255,.75)}
.glass input:focus{border-color:var(--gold);background:rgba(255,255,255,.22)}
.pw{position:relative}.pw input{padding-right:64px}
.pw button{position:absolute;right:8px;top:8px;background:none;border:0;color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:6px}
.glass .go{width:100%;margin-top:6px;padding:13px;border:0;border-radius:12px;background:var(--gold);color:#1B2B1F;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.glass .go:disabled{opacity:.7;cursor:wait}
.glass .err{min-height:20px;margin-top:12px;font-size:14px;font-weight:700;color:#FFE1A6}
.out{margin-left:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
@media(max-width:560px){.row{grid-template-columns:110px 1fr 60px}header h1{font-size:21px}}
</style>
</head>

var IMG_BASE = <?!= JSON.stringify(imgBase) ?>;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(n){return Number(n||0).toLocaleString('en-US');}
function sum(o){var t=0;for(var k in o){t+=o[k];}return t;}
function barRow(label,value,max,cls,right){
  var pct=max>0?Math.min(100,value/max*100):0;
  return '<div class="row"><div class="n">'+label+'</div><div class="bar"><i class="'+(cls||'')+'" style="width:'+pct+'%"></i></div><div class="v">'+(right==null?num(value):right)+'</div></div>';
}
function listBars(obj,order,cls){
  var keys=order&&order.length?order.slice():Object.keys(obj);
  Object.keys(obj).forEach(function(k){if(keys.indexOf(k)<0)keys.push(k);});
  keys=keys.filter(function(k){return obj[k]>0;}).sort(function(a,b){return obj[b]-obj[a];});
  if(!keys.length)return '<div class="empty">No answers yet.</div>';
  var max=obj[keys[0]],t=sum(obj);
  return keys.map(function(k){return barRow(esc(k),obj[k],max,cls,num(obj[k])+' · '+Math.round(obj[k]/t*100)+'%');}).join('');
}
function splitBar(parts){
  var t=0;parts.forEach(function(p){t+=p.v;});
  if(!t)return '<div class="empty">No answers yet.</div>';
  var bar='<div class="split">'+parts.filter(function(p){return p.v>0;}).map(function(p){
    return '<div style="flex:'+p.v+';background:'+p.c+(p.dark?';color:#1B2B1F':'')+'">'+Math.round(p.v/t*100)+'%</div>';}).join('')+'</div>';
  var leg='<div class="legend">'+parts.map(function(p){return '<span><span class="sw" style="background:'+p.c+'"></span>'+esc(p.l)+' <b>'+num(p.v)+'</b></span>';}).join('')+'</div>';
  return bar+leg;
}

function render(s){
  var prev=document.getElementById('chk');var wasOpen=prev?prev.open:false;
  var r=s.registration,w1=s.wave1,w2=s.wave2;
  document.getElementById('today').textContent=s.today;
  document.getElementById('status').textContent='Live · updated '+s.updated;
  document.getElementById('dot').className='dot';
  var miss=[];
  if(s.missing.registration)miss.push('registration form');
  if(s.missing.wave1)miss.push('Wave 1 form');
  if(s.missing.wave2)miss.push('Wave 2 form');
  var b=document.getElementById('banner');
  var errs=[];
  ['registration','wave1','wave2'].forEach(function(k){if(s.errors&&s.errors[k])errs.push(k+': '+s.errors[k]);});
  if(miss.length){b.style.display='block';b.textContent='Not connected yet: '+miss.join(', ')+'. Paste its sheet link in Code.gs (CONFIG.SHEETS), then save and reload.';}
  else if(errs.length){b.style.display='block';b.textContent='Cannot read: '+errs.join(' | ')+'. Check the link and that the sheet belongs to the account that runs this script.';}
  else b.style.display='none';

  var pct=s.totalTarget?Math.round(r.total/s.totalTarget*100):0;
  var diff=r.total-s.expectedByNow;
  var pace=!s.planStarted?'Not started':(diff>=0?'+'+num(diff)+' ahead':num(-diff)+' behind');
  var paceNote=!s.planStarted?'plan starts 19 Nov':'plan by today: '+num(s.expectedByNow);
  document.getElementById('kpis').innerHTML=
    '<div class="kpi dark"><div class="l">Youth registered</div><div class="v">'+num(r.total)+'</div><div class="s">of '+num(s.totalTarget)+' target · '+pct+'%</div></div>'+
    '<div class="kpi"><div class="l">Registered today</div><div class="v">'+num(r.today)+'</div><div class="s">since midnight</div></div>'+
    '<div class="kpi"><div class="l">Pace against plan</div><div class="v">'+pace+'</div><div class="s">'+paceNote+'</div></div>'+
    '<div class="kpi"><div class="l">Wave 1 surveys</div><div class="v">'+num(w1.total)+'</div><div class="s">answers so far</div></div>'+
    '<div class="kpi"><div class="l">Wave 2 surveys</div><div class="v">'+num(w2.total)+'</div><div class="s">answers so far</div></div>';

  var html='';


  // coordinators compared
  var started=s.planStarted;
  var order=s.regions.slice().sort(function(a,b){return (b.count/b.target)-(a.count/a.target);});
  var topPct=order.length?order[0].count/order[0].target:0;
  var cards=s.regions.map(function(g){
    var pc=g.target?Math.round(g.count/g.target*100):0;
    var gap=g.count-g.expected;
    var paceTxt=!started?'Not started':(gap>=0?'+'+num(gap)+' ahead':num(-gap)+' behind');
    var isLead=g.count>0&&(g.count/g.target)===topPct&&started;
    var cum=0;
    var mini=['2026-11','2026-12','2027-01'].map(function(k,i){
      cum+=(g.byMonth[k]||0);
      var future=k>s.monthNow;
      var okp=cum>=g.planByMonth[i];
      return '<div class="'+(future?'':(okp?'ahead':'behind'))+'">'+s.months[i]+'<b>'+(future?'–':num(cum))+'</b>plan '+num(g.planByMonth[i])+'</div>';
    }).join('');
    var fin=g.finishedAll?Math.round(g.finishedYes/g.finishedAll*100)+'%':'–';
    var fem=(g.female+g.male)?Math.round(g.female/(g.female+g.male)*100)+'%':'–';
    return '<div class="rc'+(isLead?' lead':'')+'">'+(isLead?'<span class="tag">Leading</span>':'')+
      '<div class="who">'+g.name.toUpperCase()+' REGION</div><div class="nm">'+esc(g.coordinator)+'</div>'+
      '<div class="big">'+num(g.count)+' <small>of '+num(g.target)+' · '+pc+'%</small></div>'+
      '<div class="bar" style="margin-top:8px"><i class="'+(g.count>=g.target?'over':g.name.toLowerCase())+'" style="width:'+Math.min(100,pc)+'%"></i></div>'+
      '<dl><dt>Against plan today</dt><dd>'+paceTxt+'</dd>'+
      '<dt>Registered today</dt><dd>'+num(g.today)+'</dd>'+
      '<dt>Volunteers reporting</dt><dd>'+num(g.volunteers)+'</dd>'+
      '<dt>Finished on YOMA</dt><dd>'+fin+'</dd>'+
      '<dt>Girls and young women</dt><dd>'+fem+'</dd>'+
      '<dt>Wave 1 · Wave 2 surveys</dt><dd>'+num(g.wave1)+' · '+num(g.wave2)+'</dd></dl>'+
      '<div class="mini">'+mini+'</div></div>';
  }).join('');
  html+='<div class="panel wide"><h2>District coordinators compared</h2><div class="hint">Each region against its own target and plan. Month boxes show the running total against that region\'s plan (green is on or ahead of plan).</div><div class="rg">'+cards+'</div></div>';

  // districts
  var dRows=s.districts.map(function(d){
    var cls=d.count>=d.target?'over':d.region.toLowerCase();
    return barRow(esc(d.name)+' <span class="chip">'+d.region+'</span>',d.count,d.target,cls,num(d.count)+' / '+d.target);
  }).join('');
  html+='<div class="panel wide"><h2>Registrations by district</h2><div class="hint">Bar fills toward each district target. Gold means the target is reached.</div>'+dRows+'</div>';

  // months
  var cum=0,maxv=Math.max.apply(null,s.plan.concat([r.total,1]));
  var cols=s.months.map(function(m,i){
    var key=['2026-11','2026-12','2027-01','2027-02'][i];
    cum+=(r.byMonth[key]||0);
    var H=170,future=key>s.monthNow;
    var ph=Math.max(2,Math.round(s.plan[i]/maxv*H)),ah=Math.max(2,Math.round(cum/maxv*H));
    return '<div class="mcol"><div class="mpair"><div class="mb plan" style="height:'+ph+'px">'+num(s.plan[i])+'</div>'+(future?'<div class="mb" style="height:2px"></div>':'<div class="mb act" style="height:'+ah+'px">'+num(cum)+'</div>')+'</div><div class="mlab">End '+m+'</div></div>';
  }).join('');
  html+='<div class="panel"><h2>Plan against actual</h2><div class="hint">Running total of registrations at the end of each month. Dashed bar is the plan.</div><div class="months">'+cols+'</div></div>';

  // latest
  var latest=(r.latest||[]).map(function(x){return '<li><span>'+esc(x.district)+'</span><span>'+esc(x.when)+'</span></li>';}).join('');
  html+='<div class="panel"><h2>Latest registrations</h2><div class="hint">Newest first. District and time only.</div>'+(latest?'<ul class="latest">'+latest+'</ul>':'<div class="empty">None yet.</div>')+'</div>';

  // volunteers
  var vt=s.volunteerTarget;
  var vRows=(r.volunteers||[]).map(function(v){
    return barRow(esc(v.name)+(v.district?' <span class="chip">'+esc(v.district)+'</span>':''),v.count,vt,v.count>=vt?'over':'',num(v.count)+' / '+vt);
  }).join('');
  html+='<div class="panel"><h2>Volunteers</h2><div class="hint">Youth each volunteer has registered, against the '+vt+' target. Names are grouped by spelling.</div><div class="list">'+(vRows||'<div class="empty">No registrations yet.</div>')+'</div></div>';

  // who
  var g=r.gender||{};
  html+='<div class="panel"><h2>Who is registering</h2><div class="hint">Gender</div>'+splitBar([
    {l:'Female',v:g.Female||0,c:'#1E4D2B'},{l:'Male',v:g.Male||0,c:'#7FB35C'},{l:'Prefer not to say',v:g['Prefer not to say']||0,c:'#F2C14E',dark:1}])+
    '<div class="hint" style="margin-top:14px">Age</div>'+listBars(r.ages||{},['Under 16','16 to 17','18 to 24','25 to 35','36 and over'],'')+
    '<div class="hint" style="margin-top:14px">Under 16 with a parent or guardian named: <b>'+num(r.under16WithConsent)+' of '+num(r.under16)+'</b></div></div>';

  // disability + finishing
  html+='<div class="panel"><h2>Disability and sign-up status</h2><div class="hint">Young people with a difficulty: <b>'+num(r.difficulty.any)+'</b> of '+num(r.total)+'</div>'+
    listBars(r.difficulty.types||{},[],'south')+
    '<div class="hint" style="margin-top:14px">Finished registering on YOMA</div>'+splitBar([
    {l:'Yes',v:r.finished.Yes,c:'#1E4D2B'},{l:'Not yet',v:r.finished['Not yet'],c:'#F2C14E',dark:1}])+
    '<div class="hint" style="margin-top:14px">OK to contact</div>'+splitBar([
    {l:'Yes',v:r.contactOk.Yes,c:'#3E7D23'},{l:'No',v:r.contactOk.No,c:'#A9D18E',dark:1}])+'</div>';

  // wave 1
  html+='<div class="panel"><h2>Wave 1: what they would buy first</h2><div class="hint">'+num(w1.total)+' answers</div>'+listBars(w1.buy||{},[],'')+
    '<div class="hint" style="margin-top:14px">Have heard of YOMA before</div>'+splitBar([
    {l:'Yes',v:w1.heard.Yes,c:'#1E4D2B'},{l:'No',v:w1.heard.No,c:'#F2C14E',dark:1}])+'</div>';

  // wave 2
  html+='<div class="panel"><h2>Wave 2: how it is going</h2><div class="hint">'+num(w2.total)+' answers</div>'+splitBar([
    {l:'Registered and used it',v:w2.usage['Registered and used it'],c:'#1E4D2B'},
    {l:'Registered but not used',v:w2.usage['Registered but not used'],c:'#7FB35C'},
    {l:'Did not register',v:w2.usage['Did not register'],c:'#F2C14E',dark:1}])+
    '<div class="hint" style="margin-top:14px">Problems they had</div>'+listBars(w2.problems||{},[],'south')+
    '<div class="hint" style="margin-top:14px">What would make YOMA better (latest)</div>'+
    ((w2.ideas||[]).map(function(i){return '<div class="idea">'+esc(i.text)+(i.district?' <span>· '+esc(i.district)+'</span>':'')+'</div>';}).join('')||'<div class="empty">None yet.</div>')+'</div>';

  // connection check
  var names={registration:'Registration form',wave1:'Wave 1 survey',wave2:'Wave 2 survey'};
  var bad=0,chk='';
  ['registration','wave1','wave2'].forEach(function(k){
    var c=s.check[k];if(!c)return;
    if(c.missing.length)bad++;
    chk+='<div class="row" style="grid-template-columns:150px 1fr"><div class="n">'+names[k]+'</div><div>'+
      (s.missing[k]?'<span class="chip" style="background:#FFF6DA">not connected</span>':
       num(c.rows)+' answers read · '+(c.missing.length?'<b style="color:#B3261E">columns not found: '+esc(c.missing.join(', '))+'</b>':'<b style="color:#3E7D23">all columns found</b>'))+'</div></div>';
  });
  html+='<div class="panel wide"><details id="chk"'+((bad||wasOpen)?' open':'')+'><summary style="cursor:pointer;font-weight:700;color:#1E4D2B">Connection check</summary><div class="hint" style="margin-top:6px">If a column is not found, the question wording in the form changed. Tell the dashboard builder which question it is.</div>'+chk+'</div></details></div>';

  document.getElementById('grid').innerHTML=html;
}

function fail(err){
  document.getElementById('dot').className='dot off';
  document.getElementById('status').textContent='Cannot load: '+(err&&err.message?err.message:err);
}
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function call(fn,args,ok,bad){
  if(IS_GAS){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(bad);r[fn].apply(r,args);return;}
  if(!API_URL||API_URL.indexOf('PASTE')===0){bad(new Error('Paste your web app link into API_URL in docs/index.html'));return;}
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){return r.json();})
    .then(function(j){if(j.error)bad(new Error(j.error));else ok(j.result);})
    .catch(bad);
}
function getTok(){try{return localStorage.getItem('yomaTok')||'';}catch(e){return '';}}
function setTok(v){try{if(v)localStorage.setItem('yomaTok',v);else localStorage.removeItem('yomaTok');}catch(e){}}
var TOKEN=getTok();

function showLogin(msg){
  if(timer){clearInterval(timer);timer=null;}
  document.body.classList.add('locked');
  document.getElementById('lgErr').textContent=msg||'';
  document.getElementById('lgGo').disabled=false;
  document.getElementById('lgGo').textContent='Sign in';
}
function startDashboard(){
  document.body.classList.remove('locked');
  load();
  if(timer)clearInterval(timer);
  timer=setInterval(load,EVERY);
}
function loadFail(err){
  var m=err&&err.message?err.message:String(err);
  if(m.indexOf('SIGN_IN_NEEDED')>=0){TOKEN='';setTok('');showLogin('Please sign in again.');return;}
  fail(err);
}
function load(){
  if(document.hidden||!TOKEN)return;
  call('getStats',[TOKEN],render,loadFail);
}

// images from GitHub (logo.png, background.png), with built-in fallbacks
(function(){
  var base=IS_GAS?IMG_BASE:'';
  if(!IS_GAS||base){
    var lg=document.getElementById('lgLogo'),fallback=lg.src;
    lg.onerror=function(){lg.onerror=null;lg.src=fallback;};
    lg.src=base+'logo.png';
    var bg=new Image();
    bg.onload=function(){document.getElementById('login').style.setProperty('--bgimg','url("'+bg.src+'")');};
    bg.src=base+'background.png';
  }
})();

document.getElementById('lgShow').onclick=function(){
  var p=document.getElementById('lgPass');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'Show':'Hide';
};
document.getElementById('lgForm').onsubmit=function(ev){
  ev.preventDefault();
  var u=document.getElementById('lgUser').value,p=document.getElementById('lgPass').value;
  var b=document.getElementById('lgGo');b.disabled=true;b.textContent='Signing in…';
  document.getElementById('lgErr').textContent='';
  call('login',[u,p],function(tok){
    TOKEN=tok;setTok(tok);document.getElementById('lgPass').value='';startDashboard();
  },function(err){
    var m=err&&err.message?err.message:String(err);
    showLogin(m.indexOf('Wrong')>=0?'Wrong username or password.':'Cannot sign in: '+m);
  });
};
document.getElementById('signOut').onclick=function(){
  if(TOKEN)call('logout',[TOKEN],function(){},function(){});
  TOKEN='';setTok('');showLogin('');
};
document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
if(TOKEN)startDashboard();else showLogin('');
</script>
